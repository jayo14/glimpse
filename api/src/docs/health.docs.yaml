paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - Health
      responses:
        200:
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: glimpse-api

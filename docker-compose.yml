services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: eventlens
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml-worker:
    build:
      context: ./processing
      dockerfile: Dockerfile
    command: ["sh", "-c", "python check_env.py && arq app.worker.WorkerSettings"]
    env_file:
      - ./processing/.env
    depends_on:
      - redis
      - db
    volumes:
      - ./processing:/app
      - ./processing/models:/app/models

volumes:
  postgres_data:

name: glimpse_mobile
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.1.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  phosphor_flutter: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf

dependency_overrides:
  phosphor_flutter:
    git:
      url: https://github.com/phosphor-icons/flutter.git
      ref: main

workflows:
  # ─────────────────────────────────────────────────────────────────────────────
  # Android debug build – runs on every push to main / feature branches
  # ─────────────────────────────────────────────────────────────────────────────
  android-debug:
    name: Glimpse Mobile – Android Debug
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.4        # pin to match local Flutter 3.44.x (Dart 3.12+)
      java: 17
      # Secrets expected in Codemagic → Environment variables:
      #   SUPABASE_URL, SUPABASE_ANON_KEY  (used to populate .env at build time)

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true
        - pattern: "develop"
          include: true
        - pattern: "feature/*"
          include: true

    # The Flutter project lives in mobile/, not the repo root
    working_directory: mobile

    scripts:
      - name: Write .env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run static analysis
        script: flutter analyze --no-pub

      - name: Run unit & widget tests
        script: flutter test --no-pub

      - name: Build Android APK (debug)
        script: flutter build apk --debug

    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - team@glimpse.app   # replace with your real address
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Android release build – produces a signed AAB for Play Store distribution
  # ─────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Glimpse Mobile – Android Release
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.4
      java: 17
      android_signing:
        - glimpse_keystore          # Codemagic → Code signing → Android → keystore name
      groups:
        - glimpse_env               # Codemagic → Teams → Environment variable group

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    working_directory: mobile

    scripts:
      - name: Write .env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run static analysis
        script: flutter analyze --no-pub

      - name: Run unit & widget tests
        script: flutter test --no-pub

      - name: Build Android App Bundle (release)
        script: |
          flutter build appbundle \
            --release \
            --build-name="${FCI_TAG#v}" \
            --build-number="$BUILD_NUMBER"

    artifacts:
      - mobile/build/app/outputs/bundle/release/app-release.aab
      - mobile/build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - team@glimpse.app
        notify:
          success: true
          failure: true
      # Uncomment once you connect a Google Play service account in Codemagic:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS debug build (requires a Mac instance and Apple Developer account)
  # ─────────────────────────────────────────────────────────────────────────────
  ios-debug:
    name: Glimpse Mobile – iOS Debug
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      # ios_signing:
      #   distribution_type: development
      #   bundle_identifier: com.glimpse.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true

    working_directory: mobile

    scripts:
      - name: Write .env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run static analysis
        script: flutter analyze --no-pub

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build iOS (no codesign)
        script: |
          flutter build ios \
            --debug \
            --no-codesign

    artifacts:
      - mobile/build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - team@glimpse.app
        notify:
          success: true
          failure: true
